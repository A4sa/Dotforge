#     ╚═╝   ╚═╝     ╚═╝ ╚═════╝ ╚═╝  ╚═╝     ╚═════╝ ╚═════╝ ╚═╝  ╚═══╝╚═╝
#
#  File name   : ~/.tmux.conf
#  Author      : Abdul Sattar
#  Email       : abdul.linuxdev@gmail.com
#  Repository  : https://github.com/A4sa/dotforge.git
#  Description : Annotated tmux configuration for embedded systems engineers.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │  TMUX CORE CONCEPTS — READ THIS FIRST                                    │
# │                                                                          │
# │  tmux has three layers. Understanding them makes everything else click:  │
# │                                                                          │
# │  SESSION                                                                 │
# │  ────────                                                                │
# │  A session is a container that lives on the server independently of      │
# │  your terminal. It persists even after you close GNOME Terminal,         │
# │  disconnect SSH, or reboot the display. This is the killer feature:      │
# │  a 2-hour kernel build keeps running after you close the window.         │
# │  You can have multiple sessions — one per project or per board.          │
# │                                                                          │
# │  WINDOW                                                                  │
# │  ────────                                                                │
# │  A window lives inside a session. Think of it as a tab in a browser.     │
# │  Each window has a name and fills the entire terminal. You can have      │
# │  many windows per session — one for BSP work, one for ADB, one for       │
# │  documentation.                                                          │
# │                                                                          │
# │  PANE                                                                    │
# │  ────────                                                                │
# │  A pane is a subdivision of a window. This is what you want for your     │
# │  3-terminal workflow: one window split into 3 panes — Vim on the left,   │
# │  build output in the middle, serial log on the right. All panes are      │
# │  visible simultaneously in one window.                                   │
# │                                                                          │
# │  ┌─ GNOME Terminal ────────────────────────────────────────────────┐     │
# │  │ ┌─ tmux session: "cv25-bsp" ──────────────────────────────────┐ │     │
# │  │ │ [0:vim] [1:adb] [2:docs]  ← windows (tabs)                  │ │     │ 
# │  │ │ ┌───────────────┬──────────────┬───────────────┐            │ │     │
# │  │ │ │  Vim editor   │  make -j8    │  dmesg -w     │            │ │     │
# │  │ │ │  (pane 0)     │  (pane 1)    │  (pane 2)     │            │ │     │
# │  │ │ │               │              │               │            │ │     │
# │  │ │ └───────────────┴──────────────┴───────────────┘            │ │     │
# │  │ └────────────────────────────────────────────────────────────-┘ │     │
# │  └─────────────────────────────────────────────────────────────────┘     │
# └──────────────────────────────────────────────────────────────────────────┘
#
#  INSTALL
#  -------
#  sudo apt install tmux
#  Place this file at: ~/.tmux.conf
#  Reload without restarting: tmux source ~/.tmux.conf
#                         or: Prefix + r  (mapped below)
#
#  FIRST START
#  -----------
#  tmux                          → start a new unnamed session
#  tmux new -s cv25-bsp          → start a named session
#  tmux attach                   → re-attach to last session
#  tmux attach -t cv25-bsp       → re-attach to a named session
#  tmux ls                       → list all sessions
#
# ==================================================================================




# ============================================================================
# [1]  PREFIX KEY
# ============================================================================
#
# WHAT IS THE PREFIX?
# -------------------
# Every tmux command starts with a prefix key — a chord that tells tmux
# "the next key is for you, not the shell". Think of it as tmux's <Leader>.
#
# DEFAULT: Ctrl+B  (kept — Ctrl+A is picocom's / minicom's escape key and
#                   screen users on the serial console need it).


# ============================================================================
# [2]  CORE BEHAVIOR
# ============================================================================
set -g base-index 1                  # Windows numbered from 1 (matches the keyboard)
set -g pane-base-index 1
set -g renumber-windows on           # No gaps after closing a window
set -sg escape-time 10               # Fast Esc for Vim, but no garbage on slow SSH links
set -g history-limit 100000          # Long scrollback for full boot logs and builds
set -g set-titles on
set -g set-titles-string "#S: #W"
set -g focus-events on               # Lets Vim reload files changed by a build ('autoread')
setw -g aggressive-resize on
set -g mouse on                      # Scroll the wheel into copy mode, click panes, drag borders
set -g display-time 2000             # Status messages stay readable


# ============================================================================
# [3]  TERMINAL & COLOR
# ============================================================================
# tmux-256color is the correct TERM inside tmux. Boards that lack its terminfo
# are handled by the 'ssh' alias in bash_aliases (sends TERM=xterm-256color).
set -g default-terminal "tmux-256color"
# True colour (24-bit) for Vim's termguicolors.
set -as terminal-features ",*256col*:RGB,xterm-kitty:RGB,alacritty:RGB,foot:RGB"
set -as terminal-overrides ",*256col*:Tc"


# ============================================================================
# [4]  PANE SPLITTING
# ============================================================================

# Prefix+h → new pane below.   Prefix+v → new pane to the right.
# Both open in the current pane's directory.
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
# Keep the classic keys too, also in the current directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"


# ============================================================================
# [5]  PANE NAVIGATION
# ============================================================================

# Switch pane focus with Alt+Arrow keys (no prefix required).
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Kill the current pane (asks first).
bind x confirm-before -p "Kill pane #P? (y/n)" kill-pane


# ============================================================================
# [6]  PANE RESIZING
# ============================================================================

# Prefix + Shift+Arrow resizes by 3 cells; hold to repeat (-r).
bind -r S-Left  resize-pane -L 3
bind -r S-Right resize-pane -R 3
bind -r S-Up    resize-pane -U 3
bind -r S-Down  resize-pane -D 3


# ============================================================================
# [7]  WINDOW MANAGEMENT
# ============================================================================

# Create a new window with Prefix+c, opening in the current directory.
bind c new-window -c "#{pane_current_path}"

# Previous / next window: Prefix+p / Prefix+n (tmux defaults), or
# Shift+Left / Shift+Right without the prefix.
bind -n S-Left  previous-window
bind -n S-Right next-window

# Alt+1..9 jumps straight to a window (no prefix).
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Move the current window left / right in the status bar.
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Close the current window (and all its panes) with Prefix+X.
bind X confirm-before -p "Kill window #W? (y/n)" kill-window


# ============================================================================
# [8]  WORKSPACE LAYOUTS
# ============================================================================

# Prefix+A — BSP development window:
#   ┌──────────────────┬──────────────┐
#   │                  │  build       │   'mkl ' typed, press Enter to build
#   │   vim            ├──────────────┤
#   │                  │  console     │   'con ' typed, add port/baud + Enter
#   └──────────────────┴──────────────┘
# Commands are typed but not run, so nothing starts on the wrong board.
bind A new-window -n bsp -c "#{pane_current_path}" \; \
    send-keys "vim" Enter \; \
    split-window -h -l 40% -c "#{pane_current_path}" \; \
    send-keys "mkl " \; \
    split-window -v -l 50% -c "#{pane_current_path}" \; \
    send-keys "con " \; \
    select-pane -t "{left}"

# Prefix+B — two ADB shells side by side (e.g. two devices / two displays).
# Each pane lists devices; type 'ANDROID_SERIAL=<id> adb shell'.
bind B new-window -n adb -c "#{pane_current_path}" \; \
    send-keys "adb devices -l" Enter \; \
    split-window -h -c "#{pane_current_path}" \; \
    send-keys "adb devices -l" Enter


# ============================================================================
# [9]  SESSION MANAGEMENT
# ============================================================================

# Create a new named session from within tmux.
bind S command-prompt -p "New session name:" "new-session -s '%%'"

# Switch between sessions interactively (tree view with preview).
bind s choose-tree -sZ


# ============================================================================
# [10]  LOGGING — capture a pane to a file
# ============================================================================
# Prefix+L toggles logging of the current pane (serial console, build, adb
# logcat) to ~/tmux_logs/. Everything printed while it is on is saved.
bind L run-shell "mkdir -p ~/tmux_logs" \; \
    pipe-pane -o "cat >> ~/tmux_logs/'#{session_name}_#{window_name}_#{pane_index}'_$(date +%Y%m%d-%H%M%S).log" \; \
    display-message "Pane logging toggled (~/tmux_logs/)"

# Prefix+K clears the pane's scrollback (fresh start before a new boot log).
bind K send-keys -R \; clear-history \; display-message "Scrollback cleared"


# ============================================================================
# [11]  STATUS BAR & UI THEME  (Catppuccin Mocha)
# ============================================================================
#
#   ( TMUX)( bsp)  (1 vim)(2 build 󱅫)        main  linux ( 0.42 │ 󰍛 37%)( edgeverse)( 23:10)
#    └ mode  └ session └ windows: active = mauve   └ git + dir  └ load / RAM    └ host       └ time
#
#   MODE pill:  TMUX (green) · PREFIX (red, after Ctrl+B) · COPY (yellow) · ZOOM (peach)
#   Window icons: 󰁓 zoomed · 󱅫 output in a background window (e.g. build finished) · 󰂞 bell
#
# Needs a Nerd Font in the terminal (icons and rounded edges). Without one,
# put  set -g @df_plain 1  in ~/.tmux.local.conf … or simply install
# "JetBrainsMono Nerd Font" and select it in the terminal profile.

# ── Palette (change these to re-theme everything) ───────────────────────────
set -g @c_base     "#1e1e2e"
set -g @c_mantle   "#181825"
set -g @c_crust    "#11111b"
set -g @c_surface0 "#313244"
set -g @c_surface1 "#45475a"
set -g @c_overlay  "#6c7086"
set -g @c_subtext  "#a6adc8"
set -g @c_text     "#cdd6f4"
set -g @c_mauve    "#cba6f7"
set -g @c_green    "#a6e3a1"
set -g @c_red      "#f38ba8"
set -g @c_yellow   "#f9e2af"
set -g @c_peach    "#fab387"
set -g @c_blue     "#89b4fa"
set -g @c_teal     "#94e2d5"
set -g @c_lavender "#b4befe"

# Mode indicator — computed on every redraw.
set -g @df_mode_color "#{?client_prefix,#{@c_red},#{?pane_in_mode,#{@c_yellow},#{?window_zoomed_flag,#{@c_peach},#{@c_green}}}}"
set -g @df_mode_text  "#{?client_prefix,󰌌 PREFIX,#{?pane_in_mode,󰆏 COPY,#{?window_zoomed_flag,󰊓 ZOOM, TMUX}}}"

# ── Bar placement & base style ──────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#{@c_base},fg=#{@c_text}"

# ── LEFT: mode pill + session pill ──────────────────────────────────────────
set -g status-left-length 60
set -g status-left "\
#[fg=#{E:@df_mode_color},bg=#{@c_base}]\
#[fg=#{@c_crust},bg=#{E:@df_mode_color},bold]#{E:@df_mode_text}\
#[fg=#{E:@df_mode_color},bg=#{@c_base},nobold] \
#[fg=#{@c_surface0},bg=#{@c_base}]\
#[fg=#{@c_mauve},bg=#{@c_surface0},bold] #S\
#[fg=#{@c_surface0},bg=#{@c_base},nobold]  "

# ── WINDOWS: tab pills ──────────────────────────────────────────────────────
set -g window-status-separator " "
set -g window-status-format "\
#[fg=#{@c_surface0},bg=#{@c_base}]\
#[fg=#{@c_overlay},bg=#{@c_surface0}]#I \
#[fg=#{@c_subtext}]#W\
#{?window_zoomed_flag, 󰊓,}\
#[fg=#{@c_peach}]#{?window_activity_flag, 󱅱,}#{?window_bell_flag, 󰂞,}\
#[fg=#{@c_surface0},bg=#{@c_base}]"
set -g window-status-current-format "\
#[fg=#{@c_mauve},bg=#{@c_base}]\
#[fg=#{@c_crust},bg=#{@c_mauve},bold]#I \
#[fg=#{@c_text},bg=#{@c_surface1}] #W\
#{?window_zoomed_flag, 󰊓,}\
#[fg=#{@c_surface1},bg=#{@c_base},nobold]"

# Flag windows where something new was printed (build finished, logcat line).
setw -g monitor-activity on
set -g visual-activity off
set -g bell-action other

# ── RIGHT: git branch · directory · load/RAM · host · time ─────────────────
# git/dir follow the ACTIVE pane. Load is the 1-min average (compare with
# 'nproc'); RAM is used memory excluding cache.
set -g status-right-length 160
set -g status-right "\
#[fg=#{@c_overlay},bg=#{@c_base}]\
#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null | sed 's/^/ /;s/$/  /')\
#[fg=#{@c_subtext}] #{b:pane_current_path}  \
#[fg=#{@c_blue},bg=#{@c_base}]\
#[fg=#{@c_crust},bg=#{@c_blue}] #(cut -d' ' -f1 /proc/loadavg) │ 󰍛 #(awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{print int(100-a*100/t)}' /proc/meminfo)%%\
#[fg=#{@c_blue},bg=#{@c_base}] \
#[fg=#{@c_surface0},bg=#{@c_base}]\
#[fg=#{@c_lavender},bg=#{@c_surface0}] #H\
#[fg=#{@c_surface0},bg=#{@c_base}] \
#[fg=#{@c_peach},bg=#{@c_base}]\
#[fg=#{@c_crust},bg=#{@c_peach},bold] %H:%M\
#[fg=#{@c_peach},bg=#{@c_base},nobold]"

# ── Pane borders with titles ────────────────────────────────────────────────
# Each pane shows its number, running command and directory on its top
# border — in the Prefix+A layout you see at a glance which pane is
# vim / build / console. The active pane's border is mauve.
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-style "fg=#{@c_surface0}"
set -g pane-active-border-style "fg=#{@c_mauve}"
set -g pane-border-format "\
#{?pane_active,#[fg=#{@c_mauve}#,bold],#[fg=#{@c_overlay}]} #P \
#[nobold]#{pane_current_command} #[fg=#{@c_overlay}]· #{b:pane_current_path} "
# Pane numbers (Prefix+q) in theme colours.
set -g display-panes-active-colour "#cba6f7"
set -g display-panes-colour "#45475a"

# ── Messages, prompts, copy-mode selection, menus ───────────────────────────
set -g message-style "bg=#{@c_surface0},fg=#{@c_text},bold"
set -g message-command-style "bg=#{@c_surface0},fg=#{@c_yellow}"
set -g mode-style "bg=#{@c_surface1},fg=#{@c_yellow}"
set -g copy-mode-match-style "bg=#{@c_surface1},fg=#{@c_text}"
set -g copy-mode-current-match-style "bg=#{@c_peach},fg=#{@c_crust}"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@c_mauve}"
set -g menu-border-lines rounded
set -g menu-style "bg=#{@c_base},fg=#{@c_text}"
set -g menu-selected-style "bg=#{@c_mauve},fg=#{@c_crust}"
set -g clock-mode-colour "#cba6f7"
setw -g clock-mode-style 24

# ── Plain fallback (no Nerd Font): set -g @df_plain 1 in ~/.tmux.local.conf ─
# Applied at the end of this file, after ~/.tmux.local.conf is read.


# ============================================================================
# [12]  COPY MODE
# ============================================================================
#
# Copy mode lets you scroll back through a pane's history, search it, and
# select text — essential for build errors and boot logs.
#
# ENTER copy mode: Prefix+[ (or scroll the mouse wheel up)
# EXIT  copy mode: q or Escape
#
# This config uses VI KEYS in copy mode — consistent with your Vim muscle memory.

setw -g mode-keys vi

# Start a selection with 'v', toggle rectangle with Ctrl+V (like Vim).
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Clipboard. Two paths, so copying works everywhere:
#   1. OSC 52 (set-clipboard on): reaches your LOCAL clipboard over SSH on
#      kitty, Alacritty, WezTerm, iTerm2. GNOME Terminal IGNORES OSC 52, so
#      on its own it silently copies nothing.
#   2. A real clipboard tool (wl-copy / xclip), picked once here and stored in
#      @df_clip. Used by every copy binding below.
set -s set-clipboard on
if-shell 'command -v wl-copy >/dev/null 2>&1 && [ -n "$WAYLAND_DISPLAY" ]' \
    'set -g @df_clip "wl-copy"' \
    'if-shell "command -v xclip >/dev/null 2>&1 && [ -n \"$DISPLAY\" ]" \
        "set -g @df_clip \"xclip -in -selection clipboard\"" \
        "set -g @df_clip \"\""'

# Copy with the keyboard: y or Enter (both leave copy mode).
# If no clipboard tool is found, fall back to the tmux buffer + OSC 52.
if-shell '[ -n "#{@df_clip}" ]' \
    'bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "#{@df_clip}"
     bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@df_clip}"' \
    'bind -T copy-mode-vi y     send-keys -X copy-selection-and-cancel
     bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel'

# Copy with the MOUSE: just drag inside ONE pane. The selection stays within
# that pane and is copied the moment you release the button. The selection
# stays highlighted (no -and-cancel) so you can still adjust it; press q/Esc.
#   drag        select text in this pane only
#   double-click select word      triple-click select line
# Do NOT use Shift+drag: that bypasses tmux and selects across every pane.
if-shell '[ -n "#{@df_clip}" ]' \
    'bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "#{@df_clip}"
     bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; send-keys -X copy-pipe "#{@df_clip}"
     bind -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; send-keys -X copy-pipe "#{@df_clip}"
     bind -n DoubleClick1Pane select-pane -t= \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode -H ; send -X select-word ; send -X copy-pipe \"#{@df_clip}\""
     bind -n TripleClick1Pane select-pane -t= \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode -H ; send -X select-line ; send -X copy-pipe \"#{@df_clip}\""' \
    'bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection'

# Dragging in a normal (non-copy-mode) pane enters copy mode and selects
# within that pane only (tmux default, kept explicit here).
bind -n MouseDrag1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode -M"

# Search: '/' forward, '?' backward, n / N next / previous.

# Paste the most recent tmux buffer: Prefix+] (default).
# Paste from the system clipboard: Prefix+P.
if-shell 'command -v wl-paste >/dev/null 2>&1 && [ -n "$WAYLAND_DISPLAY" ]' \
    'bind P run "wl-paste -n | tmux load-buffer - && tmux paste-buffer"' \
    'bind P run "xclip -out -selection clipboard | tmux load-buffer - && tmux paste-buffer"'


# ============================================================================
# [13]  RELOAD CONFIG
# ============================================================================

# Reload this config file without restarting tmux (Prefix+r).
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Open this config file for editing directly from tmux (Prefix+e).
bind e new-window -n "tmux-config" "vim ~/.tmux.conf"

# Machine-local overrides (not in the repo).
if-shell "[ -f ~/.tmux.local.conf ]" "source-file ~/.tmux.local.conf"

# Plain status bar for terminals without a Nerd Font (no icons / rounded
# edges, same colours). Enable with  set -g @df_plain 1  in ~/.tmux.local.conf
if -F "#{@df_plain}" {
    set -g status-left "#[fg=#{@c_crust},bg=#{E:@df_mode_color},bold] #{?client_prefix,PREFIX,#{?pane_in_mode,COPY,#{?window_zoomed_flag,ZOOM,TMUX}}} #[fg=#{@c_mauve},bg=#{@c_surface0}] #S #[default]  "
    set -g window-status-format "#[fg=#{@c_subtext},bg=#{@c_surface0}] #I #W#{?window_zoomed_flag, Z,}#{?window_activity_flag, +,} #[default]"
    set -g window-status-current-format "#[fg=#{@c_crust},bg=#{@c_mauve},bold] #I #W#{?window_zoomed_flag, Z,} #[default]"
    set -g status-right "#[fg=#{@c_subtext}]#{b:pane_current_path}  #[fg=#{@c_crust},bg=#{@c_blue}] load #(cut -d' ' -f1 /proc/loadavg) #[fg=#{@c_lavender},bg=#{@c_surface0}] #H #[fg=#{@c_crust},bg=#{@c_peach},bold] %H:%M "
    set -g pane-border-lines single
}


# ============================================================================
# COMPLETE KEY REFERENCE
# ============================================================================
#
#  SPLITTING PANES
#  ───────────────────────────────────────────────────────────────────────────
#  Prefix + h  (or ")        Horizontal split — new pane below
#  Prefix + v  (or %)        Vertical split   — new pane to the right
#
#  NAVIGATING PANES
#  ───────────────────────────────────────────────────────────────────────────
#  Alt+Arrow     [no prefix] Move focus to pane in that direction
#  Prefix + z                Zoom / unzoom the current pane
#  Prefix + q                Show pane numbers (press one to jump)
#
#  RESIZING / CLOSING PANES
#  ───────────────────────────────────────────────────────────────────────────
#  Prefix + Shift+Arrow      Resize pane by 3 rows/cols (hold to repeat)
#  Prefix + x                Kill current pane (with confirmation)
#  exit / Ctrl+D (x2)        Close pane (IGNOREEOF=1 needs two Ctrl+D)
#
#  WINDOWS
#  ───────────────────────────────────────────────────────────────────────────
#  Prefix + c                New window (opens in current directory)
#  Prefix + p / n            Previous / next window
#  Shift+Left/Right [no prefix]  Previous / next window
#  Alt+1..9      [no prefix] Jump to window by number
#  Prefix + ,                Rename current window
#  Prefix + < / >            Move window left / right
#  Prefix + X                Kill window (with confirmation)
#
#  LAYOUTS
#  ───────────────────────────────────────────────────────────────────────────
#  Prefix + A                BSP window: vim | build / serial console
#  Prefix + B                Two ADB shells side by side
#  Prefix + Space            Cycle built-in layouts
#
#  SESSIONS
#  ───────────────────────────────────────────────────────────────────────────
#  Prefix + d                Detach (session keeps running)
#  Prefix + s                Choose session / window (tree)
#  Prefix + S                Create new named session
#  tmux new -s <name>        Start new named session (from shell)
#  tmux attach -t <name>     Re-attach to session (from shell)
#  tmux ls                   List all sessions (from shell)
#
#  LOGGING
#  ───────────────────────────────────────────────────────────────────────────
#  Prefix + L                Toggle logging this pane to ~/tmux_logs/
#  Prefix + K                Clear this pane's scrollback
#
#  COPY MODE
#  ───────────────────────────────────────────────────────────────────────────
#  Prefix + [ / mouse wheel  Enter copy mode
#  q / Escape                Exit copy mode
#  / or ?                    Search forward / backward
#  n / N                     Next / previous search result
#  v                         Start selection (like Vim visual)
#  Ctrl+V                    Toggle rectangular selection
#  y / Enter                 Copy selection (also to system clipboard)
#  Mouse drag                Select inside ONE pane, copied on release
#  Double / triple click     Select word / line and copy
#  Prefix + ]                Paste tmux buffer
#  Prefix + P                Paste from system clipboard
#
#  CONFIG
#  ───────────────────────────────────────────────────────────────────────────
#  Prefix + r                Reload ~/.tmux.conf
#  Prefix + e                Open ~/.tmux.conf in Vim
#
# ============================================================================
